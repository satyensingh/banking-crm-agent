services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-crm-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_crm
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/banking_crm_seed_database.sql:/docker-entrypoint-initdb.d/01-banking-crm-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: banking-crm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://banking_user:${POSTGRES_PASSWORD:-banking_dev_password}@postgres:5432/banking_crm
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: ./backend
    container_name: banking-crm-mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment:
      DATABASE_URL: postgresql://banking_user:${POSTGRES_PASSWORD:-banking_dev_password}@postgres:5432/banking_crm
      MCP_TRANSPORT: http
      MCP_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: banking-crm-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
