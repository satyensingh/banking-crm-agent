services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-crm-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_crm
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/banking_crm_seed_database.sql:/docker-entrypoint-initdb.d/01-banking-crm-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # REST adapter over the same CRM tools (optional; the chat UI does not use it)
  backend:
    build:
      context: ./backend
    container_name: banking-crm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://banking_user:${POSTGRES_PASSWORD:-banking_dev_password}@postgres:5432/banking_crm
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Chat UI: Chainlit -> LangGraph agent -> LLM, tools via the mcp service (FastMCP) -> PostgreSQL
  chainlit:
    build:
      context: ./backend
    container_name: banking-crm-chainlit
    restart: unless-stopped
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8000", "--headless"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_REASONING: ${OLLAMA_REASONING:-false}
      MCP_SERVER_URL: http://mcp:8001/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_started

  mcp:
        condition: service_started

  mcp:
    build:
      context: ./backend
    container_name: banking-crm-mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    environment:
      DATABASE_URL: postgresql://banking_user:${POSTGRES_PASSWORD:-banking_dev_password}@postgres:5432/banking_crm
      MCP_TRANSPORT: http
      MCP_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
